name: Headless behavior matrix

on:
  workflow_dispatch:
    inputs:
      app:
        description: Shared application configuration in the checkout
        required: true
        default: tests/application/app.json

jobs:
  headless:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All headless behaviors through JSON and REPL
        env:
          TEST_APP_CONFIG: ${{ inputs.app }}
        run: python3 -m tests.run --mode headless --layer system --app "$TEST_APP_CONFIG" --output target/ci-headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-matrix-results
          path: target/ci-headless
