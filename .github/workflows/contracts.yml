name: Build checks

on:
  push:
  pull_request:

jobs:
  builds:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Workspace build check
        run: cargo check --locked --workspace --all-features --all-targets
      - name: Feature builds
        run: |
          for feature in ui screenshot server client cli; do
            cargo check --locked --no-default-features --features "$feature"
          done
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
