[package]
name = "test_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[profile.dev]
# Keep debug checks while making the rendered automation workflow practical.
opt-level = 1

[features]
automation = ["dep:woodpecker"]

[dependencies]
woodpecker = { path = "..", optional = true, features = ["ui", "screenshot"] }
bevy = { version = "=0.20.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_window",
    "bevy_camera", "bevy_render", "bevy_core_pipeline", "bevy_sprite",
    "bevy_sprite_render", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets",
    "ui_picking", "bevy_input_focus", "bevy_winit", "bevy_log",
    "bevy_picking", "mouse", "keyboard", "touch", "default_font", "png", "x11",
    "bevy_pbr", "bevy_gltf", "bevy_scene", "bevy_light", "bevy_gizmos",
    "bevy_gizmos_render", "system_clipboard", "reflect_auto_register",
    "mesh_picking",
    "complex_script_segmentation",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
