version = 1

[launch]
# Relative manifests resolve from the server's working directory (repository root).
manifest_path = "test_app/Cargo.toml"
package = "test_app"
features = ["automation"]
# cargo run starts in test_app/, not beside this TOML.
arguments = ["--settings-seed", "../examples/game_tests/settings.json", "--start-unfocused", "--fixed-window", "--scale-factor", "1"]

[launch.target]
kind = "binary"
name = "test_app"

[tick.pace]
kind = "as_fast_as_possible"

[tick.clock]
kind = "fixed"
seconds_per_tick = 0.016666667

# Explicit technical preparation, NOT proof that the level is ready.
[startup]
kind = "engine"
timeout_seconds = 60
max_ticks = 3600

[report]
tracing_errors = false
output = "reports"

[report.provider]
kind = "local"
