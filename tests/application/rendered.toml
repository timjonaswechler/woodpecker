version = 1

[launch]
manifest_path = "test_app/Cargo.toml"
package = "test_app"
features = ["automation"]
arguments = ["--settings-seed", "../tests/application/settings.json", "--scale-factor", "1", "--start-unfocused", "--fixed-window"]

[launch.target]
kind = "binary"
name = "test_app"

[tick.pace]
kind = "as_fast_as_possible"

[tick.clock]
kind = "fixed"
seconds_per_tick = 0.016666667

[startup]
kind = "engine"
timeout_seconds = 60
max_ticks = 3600

[report]
tracing_errors = true
output = "reports"

[report.provider]
kind = "local"
