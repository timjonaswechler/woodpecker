version = 1

[launch]
manifest_path = "test_app/Cargo.toml"
package = "test_app"
features = []
arguments = ["--mode", "rendered"]

[launch.target]
kind = "binary"
name = "test_app"

[tick.pace]
kind = "as_fast_as_possible"

[report]
tracing_errors = true
output = "reports"

[report.provider]
kind = "local"
