version = 1

[launch]
manifest_path = "test_app/Cargo.toml"
package = "test_app"
features = ["automation"]
no_default_features = true
headless = { width = 1440, height = 900, scale_factor = 1.0 }
arguments = ["--settings-seed", "../tests/settings.json", "--fixed-window", "--scale-factor", "1"]

[launch.target]
kind = "binary"
name = "test_app"

[tick.pace]
kind = "as_fast_as_possible"

[tick.clock]
kind = "fixed"
seconds_per_tick = 0.016666667

[startup]
kind = "engine"
timeout_seconds = 60
max_ticks = 3600

[report]
tracing_errors = false
output = "reports"

[report.provider]
kind = "local"
