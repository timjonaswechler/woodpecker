[package]
name = "woodpecker-offscreen-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
woodpecker = { path = "../../..", features = ["offscreen"] }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_pbr", "bevy_light", "bevy_log", "png"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.4"
serde_json = "1"
serde = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 0
debug = 0
