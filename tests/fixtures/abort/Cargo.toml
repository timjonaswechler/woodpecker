[package]
name = "woodpecker_abort_fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[bin]]
name = "woodpecker-abort-fixture"
path = "src/main.rs"
